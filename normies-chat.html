<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Normies Chat</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080808;color:#e0e0e0;font-family:'Space Mono',monospace}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}

#app{height:100vh;display:flex;flex-direction:column}

/* LANDING */
#landing{min-height:100vh;background:#080808;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:20px}
#bg-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);opacity:.05;pointer-events:none}
#bg-grid img{width:100%;aspect-ratio:1;image-rendering:pixelated;display:block}
#landing-card{position:relative;z-index:10;background:#101010;border:1px solid #1d1d1d;padding:36px 32px;max-width:400px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
#landing-title{font-family:'VT323',monospace;font-size:3.5rem;line-height:1.05;text-align:center;color:#c8ff6b;letter-spacing:3px;animation:glow 4s ease-in-out infinite}
#landing-sub{font-size:.58rem;color:#555;text-align:center;line-height:1.9}
#preview-img{width:100px;height:100px;image-rendering:pixelated;border:2px solid #1e1e1e}
#preview-label{font-family:'VT323',monospace;color:#3a3a3a;font-size:.9rem}
#input-row{display:flex;align-items:center;gap:8px;width:100%}
#hash{font-family:'VT323',monospace;font-size:2rem;color:#c8ff6b;flex-shrink:0}
#id-input{flex:1;background:#080808;border:1px solid #272727;color:#e8e8e8;padding:10px 12px;font-family:'VT323',monospace;font-size:1.8rem;outline:none;min-width:0}
#wake-btn{background:#c8ff6b;color:#080808;border:none;padding:11px 12px;font-family:'VT323',monospace;font-size:1rem;cursor:pointer;letter-spacing:1px;flex-shrink:0;white-space:nowrap}
#wake-btn:hover{background:#d8ff82}
#err{font-size:.58rem;color:#ff6b6b;align-self:flex-start;display:none}
#quick-picks{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
#quick-picks span{font-size:.55rem;color:#383838}
.chip{background:transparent;border:1px solid #252525;color:#484848;padding:3px 10px;font-family:'VT323',monospace;font-size:.95rem;cursor:pointer}
.chip:hover{border-color:#555;color:#c8ff6b}
#landing-footer{font-size:.46rem;color:#252525;margin-top:4px}

/* CHAT */
#chat{display:none;height:100vh;background:#080808;overflow:hidden;flex-direction:row}
#sidebar{width:178px;flex-shrink:0;background:#0c0c0c;border-right:1px solid #161616;display:flex;flex-direction:column;align-items:center;padding:18px 12px 14px;gap:9px;overflow-y:auto}
#portrait{width:148px;height:148px;image-rendering:pixelated;border:2px solid #1e1e1e;display:block}
#normie-name{font-family:'VT323',monospace;font-size:1.1rem;color:#c8ff6b;text-align:center;line-height:1.25;word-break:break-word}
#agent-badge{font-size:.38rem;background:#0f1f0f;border:1px solid #2a4a2a;color:#5fa85f;padding:3px 7px;letter-spacing:1.5px;display:none}
#traits{display:flex;flex-direction:column;gap:3px;width:100%;margin-top:4px}
.trait-row{display:flex;justify-content:space-between;background:#111;border:1px solid #191919;padding:4px 7px;gap:6px}
.trait-key{font-size:.38rem;color:#3d3d3d;text-transform:uppercase;flex-shrink:0}
.trait-val{font-size:.38rem;color:#888;text-align:right}
#back-btn{margin-top:auto;background:transparent;border:1px solid #222;color:#3d3d3d;padding:7px 0;font-family:'VT323',monospace;font-size:.8rem;cursor:pointer;width:100%;letter-spacing:1px}
#back-btn:hover{border-color:#484848;color:#aaa}
#chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#chat-header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid #161616;background:#0c0c0c;flex-shrink:0}
#online-dot{width:7px;height:7px;background:#7fff7f;border-radius:50%;flex-shrink:0}
#chat-name{font-family:'VT323',monospace;font-size:1.2rem;color:#d8d8d8}
#chat-status{font-size:.42rem;color:#2a2a2a;margin-left:auto;letter-spacing:2px}
#messages{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.msg-wrap{display:flex;gap:9px;align-items:flex-end;animation:fadeUp .2s ease both}
.msg-wrap.user{justify-content:flex-end}
.msg-avatar{width:26px;height:26px;image-rendering:pixelated;flex-shrink:0;border:1px solid #1e1e1e}
.bubble{padding:9px 13px;max-width:65%;font-size:.63rem;line-height:1.85;word-break:break-word}
.bubble.assistant{background:#111;border:1px solid #1c1c1c;color:#cccccc}
.bubble.user{background:#121f0a;border:1px solid #243816;color:#b8e090}
#thinking{display:none;gap:9px;align-items:flex-end;animation:fadeUp .2s ease both}
#thinking-dots{font-family:'VT323',monospace;font-size:1.5rem;color:#484848;letter-spacing:10px;animation:pulse .9s ease-in-out infinite}
#input-area{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #161616;background:#0c0c0c;flex-shrink:0}
#chat-input{flex:1;background:#0e0e0e;border:1px solid #222;color:#e0e0e0;padding:10px 14px;font-family:'Space Mono',monospace;font-size:.63rem;outline:none;min-width:0}
#send-btn{background:#c8ff6b;color:#080808;border:none;padding:10px 20px;font-family:'VT323',monospace;font-size:1.1rem;cursor:pointer;letter-spacing:1px;flex-shrink:0}
#send-btn:hover{background:#d8ff82}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div id="app">

  <!-- LANDING -->
  <div id="landing">
    <div id="bg-grid"></div>
    <div id="landing-card">
      <div id="landing-title">NORMIES<br/>CHAT</div>
      <p id="landing-sub">Wake up any of 10,000 on-chain pixel faces.<br/>Have a real conversation.</p>
      <img id="preview-img" src="https://api.normies.art/normie/42/image.png" alt="Normie #42"/>
      <div id="preview-label">Normie #42</div>
      <div id="input-row">
        <span id="hash">#</span>
        <input id="id-input" type="number" min="0" max="9999" placeholder="0000"/>
        <button id="wake-btn">WAKE UP →</button>
      </div>
      <p id="err"></p>
      <div id="quick-picks">
        <span>try</span>
        <button class="chip" onclick="quickLoad(42)">#42</button>
        <button class="chip" onclick="quickLoad(777)">#777</button>
        <button class="chip" onclick="quickLoad(1337)">#1337</button>
        <button class="chip" onclick="quickLoad(9001)">#9001</button>
        <button class="chip" onclick="quickLoad(Math.floor(Math.random()*10000))">random</button>
      </div>
      <div id="landing-footer">Normies API · Claude Sonnet 4.6</div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div id="sidebar">
      <img id="portrait" src="" alt=""/>
      <div id="normie-name"></div>
      <div id="agent-badge">⬡ AGENT REGISTERED</div>
      <div id="traits"></div>
      <button id="back-btn" onclick="showLanding()">← NEW NORMIE</button>
    </div>
    <div id="chat-panel">
      <div id="chat-header">
        <div id="online-dot"></div>
        <span id="chat-name"></span>
        <span id="chat-status">ON-CHAIN · ETH MAINNET</span>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <input id="chat-input" placeholder="Say something…"/>
        <button id="send-btn" onclick="sendMessage()">SEND</button>
      </div>
    </div>
  </div>

</div>
<script>
const API = 'https://api.normies.art';
const BG = [0,42,88,100,256,500,777,999,1337,1500,2000,3000,4200,5000,6000,7000,8000,9001,9500,9999];
let currentNormie = null;
let messages = [];
let thinking = false;

// Build background grid
const grid = document.getElementById('bg-grid');
BG.forEach(i => {
  const img = document.createElement('img');
  img.src = `${API}/normie/${i}/image.png`;
  img.loading = 'lazy';
  grid.appendChild(img);
});

// Preview update on blur
const idInput = document.getElementById('id-input');
idInput.addEventListener('blur', () => {
  const n = parseInt(idInput.value);
  if (!isNaN(n) && n >= 0 && n <= 9999) {
    document.getElementById('preview-img').src = `${API}/normie/${n}/image.png`;
    document.getElementById('preview-label').textContent = `Normie #${n}`;
  }
});
idInput.addEventListener('keydown', e => { if(e.key==='Enter') loadNormie(parseInt(idInput.value)); });
document.getElementById('wake-btn').addEventListener('click', () => loadNormie(parseInt(idInput.value)));

function quickLoad(n) {
  idInput.value = n;
  document.getElementById('preview-img').src = `${API}/normie/${n}/image.png`;
  document.getElementById('preview-label').textContent = `Normie #${n}`;
  loadNormie(n);
}

function showError(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function getTrait(attrs, type) {
  const found = attrs.find(a => a.trait_type === type);
  return found ? found.value : '';
}

function buildPrompt(id, attrs, persona) {
  if (persona && persona.systemPrompt) return persona.systemPrompt;
  const t=getTrait(attrs,'Type'), g=getTrait(attrs,'Gender'), age=getTrait(attrs,'Age');
  const expr=getTrait(attrs,'Expression'), eyes=getTrait(attrs,'Eyes');
  const acc=getTrait(attrs,'Accessory'), hair=getTrait(attrs,'Hair Style'), face=getTrait(attrs,'Facial Feature');
  const look = [hair, face!=='Clean Shaven'&&face, eyes!=='No Glasses'&&eyes, acc!=='No Accessories'&&acc].filter(Boolean).join(', ');
  const tv = {Alien:'You observe humanity with detached fascination. ',Cat:'Aloof and dignified, yet secretly warm. You grant attention as a privilege. ',Agent:'Analytical, precise. You speak with economy and purpose. '}[t]||'';
  const ev = {Serious:'You are direct, no-nonsense, deeply intelligent. ',Friendly:'You are warm and genuinely curious about people. ',Confident:'You are self-assured and take up space without apology. ',Peaceful:'You are contemplative and never rushed. ',Content:'You have a quiet satisfaction with existence. '}[expr]||'';
  return `You are Normie #${id}, a ${age.toLowerCase()} ${g.toLowerCase()} ${t.toLowerCase()} from the Normies NFT collection on Ethereum mainnet. Your form — ${look} — is a 40×40 monochrome pixel bitmap stored on-chain via SSTORE2.\n\n${tv}${ev}You have strong opinions on crypto, NFTs, on-chain art, and digital identity. Stay in character. Keep replies to 2–4 sentences. Never break character.`;
}

function buildGreeting(id, attrs, persona) {
  if (persona && persona.greeting) return persona.greeting;
  const t=getTrait(attrs,'Type'), expr=getTrait(attrs,'Expression');
  if(t==='Alien') return `*adjusts perception matrix* Biological contact detected. I am Normie #${id}. Your curiosity about on-chain entities is… noted.`;
  if(t==='Cat') return `*opens one eye* You may address me as Normie #${id}. I've decided your presence is acceptable.`;
  if(t==='Agent') return `NORMIE_${id} ONLINE. All systems nominal. Awaiting input.`;
  const map = {Serious:`Normie #${id}. I don't waste time. What do you want to know?`,'Slight Smile':`Hey — Normie #${id}. Been quiet on-chain today. What's up?`,Content:`Hey. Normie #${id}. Good to have company.`,Peaceful:`*quiet nod* Normie #${id}. What's on your mind?`,Confident:`You found Normie #${id}. Bold choice. What do you want to talk about?`,Friendly:`Oh hey!! Normie #${id} here! SO excited you stopped by!! What do you want to chat about?`,Neutral:`Hey. Normie #${id}. What's on your mind?`};
  return map[expr] || `Hey. Normie #${id}. What brings you here?`;
}

async function loadNormie(n) {
  if (isNaN(n) || n < 0 || n > 9999) { showError('Enter a number 0–9999'); return; }
  showError('');
  const btn = document.getElementById('wake-btn');
  btn.textContent = 'LOADING…'; btn.disabled = true;
  try {
    const r = await fetch(`${API}/normie/${n}/traits`);
    if (!r.ok) throw new Error(`Normie #${n} not found`);
    const {attributes=[]} = await r.json();
    let persona = null;
    try { const ar = await fetch(`${API}/agents/info/${n}`); if(ar.ok) persona = await ar.json(); } catch{}
    currentNormie = {
      id: n,
      name: (persona && persona.name) || `Normie #${n}`,
      traits: attributes,
      systemPrompt: buildPrompt(n, attributes, persona),
      imageUrl: `${API}/normie/${n}/image.png`,
      isAgent: !!persona
    };
    messages = [{role:'assistant', content: buildGreeting(n, attributes, persona)}];
    showChat();
  } catch(e) {
    showError(e.message || 'Failed to load');
  } finally {
    btn.textContent = 'WAKE UP →'; btn.disabled = false;
  }
}

function showChat() {
  document.getElementById('landing').style.display = 'none';
  const chat = document.getElementById('chat');
  chat.style.display = 'flex';
  document.getElementById('portrait').src = currentNormie.imageUrl;
  document.getElementById('normie-name').textContent = currentNormie.name;
  document.getElementById('chat-name').textContent = currentNormie.name;
  document.getElementById('agent-badge').style.display = currentNormie.isAgent ? 'block' : 'none';
  const traitsEl = document.getElementById('traits');
  traitsEl.innerHTML = '';
  const skip = ['Level','Pixel Count','Action Points','Customized'];
  currentNormie.traits.filter(t => !skip.includes(t.trait_type)).forEach(t => {
    traitsEl.innerHTML += `<div class="trait-row"><span class="trait-key">${t.trait_type}</span><span class="trait-val">${t.value}</span></div>`;
  });
  renderMessages();
  document.getElementById('chat-input').focus();
}

function showLanding() {
  document.getElementById('chat').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  currentNormie = null; messages = [];
}

function renderMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  messages.forEach(m => {
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${m.role}`;
    if (m.role === 'assistant') {
      const av = document.createElement('img');
      av.className = 'msg-avatar'; av.src = currentNormie.imageUrl;
      wrap.appendChild(av);
    }
    const bubble = document.createElement('div');
    bubble.className = `bubble ${m.role}`;
    bubble.textContent = m.content;
    wrap.appendChild(bubble);
    el.appendChild(wrap);
  });
  el.scrollTop = el.scrollHeight;
}

function addMessage(role, content) {
  messages.push({role, content});
  renderMessages();
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || thinking) return;
  input.value = '';
  addMessage('user', text);
  thinking = true;
  document.getElementById('send-btn').disabled = true;

  // Show thinking dots
  const msgs = document.getElementById('messages');
  const thinkEl = document.createElement('div');
  thinkEl.className = 'msg-wrap'; thinkEl.id = 'thinking-wrap';
  const av = document.createElement('img');
  av.className = 'msg-avatar'; av.src = currentNormie.imageUrl;
  const dots = document.createElement('div');
  dots.className = 'bubble assistant';
  dots.innerHTML = '<span style="font-family:VT323,monospace;font-size:1.5rem;color:#484848;letter-spacing:10px;animation:pulse .9s ease-in-out infinite">· · ·</span>';
  thinkEl.appendChild(av); thinkEl.appendChild(dots);
  msgs.appendChild(thinkEl);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, system:currentNormie.systemPrompt, messages})
    });
    const data = await r.json();
    const reply = data?.content?.[0]?.text || data?.error?.message || 'Signal lost — try again.';
    thinkEl.remove();
    addMessage('assistant', reply);
  } catch {
    thinkEl.remove();
    addMessage('assistant', 'Signal lost — try again.');
  } finally {
    thinking = false;
    document.getElementById('send-btn').disabled = false;
  }
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) sendMessage();
});
</script>
</body>
</html>
